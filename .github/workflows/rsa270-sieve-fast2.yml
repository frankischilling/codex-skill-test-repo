name: RSA-270 fast 64-bit GNFS sieve v3
# campaign-trigger: 2026-09-04T15:18Z

on:
  push:
    branches: [rsa270-campaign-20260903]
    paths:
      - .github/workflows/rsa270-sieve-fast2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install targeted dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libgmp-dev libhwloc-dev \
            python3 zstd sqlite3 gh
          free -h
          df -h .

      - name: Run checksum-verified 64-bit CADO sieve driver
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rsa270/fast_sieve.sh')
          s = p.read_text()
          s = s.replace(
              '0f5238567ad06606813bd3d9306d7f54ab4e61426747e948cb84466bd70a18af',
              '2bd8bd40e89bb017b2b6af102032e97fee8ef111145a22a63798237d229bfa5f')
          s = s.replace(
              '"$BUILD/sieve/las" -version | tee "$OUT/work/original-las-version.txt"',
              'ldd "$BUILD/sieve/las" | tee "$OUT/work/original-las-version.txt"')
          p.write_text(s)
          PY
          chmod +x rsa270/fast_sieve.sh
          bash rsa270/fast_sieve.sh

      - name: Upload resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsa270-fast3-q1073322392
          path: |
            rsa270-fast3-checkpoint.tar.zst
            rsa270-fast3-checkpoint.tar.zst.sha256
          compression-level: 0
          retention-days: 14