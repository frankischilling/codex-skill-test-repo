name: RSA-270 fast 64-bit GNFS sieve v4
# campaign-trigger: 2026-09-04T15:38Z

on:
  push:
    branches: [rsa270-campaign-20260903]
    paths:
      - .github/workflows/rsa270-sieve-fast2.yml
      - rsa270/fast_sieve.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install targeted dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libgmp-dev libhwloc-dev \
            python3 zstd sqlite3 gh
          free -h
          df -h .

      - name: Rebuild with 64-bit ideal/index types and collect relations
        continue-on-error: true
        run: |
          chmod +x rsa270/fast_sieve.sh
          mkdir -p campaign/work
          set +e
          bash -x rsa270/fast_sieve.sh \
            > campaign/work/driver.stdout \
            2> campaign/work/driver.stderr
          rc=$?
          echo "$rc" > campaign/work/driver.rc
          exit 0

      - name: Upload resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsa270-fast4-q1073322392
          path: |
            rsa270-fast3-checkpoint.tar.zst
            rsa270-fast3-checkpoint.tar.zst.sha256
          compression-level: 0
          retention-days: 14